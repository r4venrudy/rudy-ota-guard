<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">RUDY OTA Guard</title>
  <desc id="desc">Offline release verification and A/B transaction simulator</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091321"/>
      <stop offset="1" stop-color="#11263a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#55e0b6" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#55e0b6" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="440" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="26" fill="url(#grid)"/>
  <path d="M0 365H1600" stroke="#55e0b6" stroke-opacity=".2"/>
  <g transform="translate(1160 62)">
    <circle cx="150" cy="150" r="128" fill="#0d1b2b" stroke="#55e0b6" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="150" cy="150" r="99" fill="none" stroke="#55e0b6" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 9"/>
    <path d="M83 136h134M83 164h134" stroke="#55e0b6" stroke-opacity=".34" stroke-width="2"/>
    <rect x="84" y="91" width="58" height="52" rx="10" fill="#102839" stroke="#55e0b6" stroke-width="2"/>
    <rect x="158" y="157" width="58" height="52" rx="10" fill="#102839" stroke="#55e0b6" stroke-width="2"/>
    <text x="113" y="124" text-anchor="middle" fill="#d9fff4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">A</text>
    <text x="187" y="190" text-anchor="middle" fill="#d9fff4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">B</text>
    <path d="M139 107l18 19-18 18M161 193l-18-19 18-18" fill="none" stroke="#55e0b6" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" filter="url(#glow)"/>
    <path d="M113 143v20c0 7 6 13 13 13h32M187 157v-20c0-7-6-13-13-13h-32" fill="none" stroke="#55e0b6" stroke-opacity=".8" stroke-width="2"/>
  </g>
  <g transform="translate(112 105)">
    <rect x="0" y="0" width="8" height="178" rx="4" fill="#55e0b6"/>
    <text x="44" y="43" fill="#55e0b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="5">RUDY SYSTEMS  /  PORTFOLIO TOOL</text>
    <text x="40" y="112" fill="#f1f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">OTA Guard</text>
    <text x="44" y="157" fill="#b7cad7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Offline release verification · A/B transaction simulator</text>
    <text x="44" y="211" fill="#55e0b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">ED25519  /  ROLLBACK CHECKS  /  ROOT ROTATION</text>
  </g>
</svg>
